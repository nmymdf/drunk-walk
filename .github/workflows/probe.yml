name: probe
on: [workflow_dispatch, push]
jobs:
  probe:
    if: contains(github.event.head_commit.message, '[probe]')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pack: [makehuman_system_assets, skins02, suits01, shirts01, pants01, shoes01, hair01, eyebrows01, eyelashes01]
    steps:
      - run: |
          BASE=https://static.makehumancommunity.org/assets/assetpacks
          curl -sL --max-time 60 "$BASE/${{ matrix.pack }}.html" -o page.html
          grep -oE 'href="[^"]+"' page.html | grep -iE 'zip|download' | head
          url=$(grep -oE 'href="[^"]+\.zip"' page.html | head -1 | sed 's/href="//;s/"$//')
          case "$url" in http*) ;; *) url="$BASE/$url";; esac
          echo "URL $url"
          curl -sIL --max-time 60 "$url" | grep -iE "^HTTP|content-length|location"
          time curl -L --max-time 1200 -s -w "CODE %{http_code} SIZE %{size_download} SPEED %{speed_download}\n" "$url" -o p.zip
          unzip -l p.zip | tail -1
          unzip -l p.zip | grep -E "mhclo|mhmat|\.png" | awk '{print $4}' | head -80
